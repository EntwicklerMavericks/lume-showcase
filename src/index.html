<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Lume — Futurewear & Tech Apparel | Plataforma E-commerce</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Lume — Futurewear & Tech Apparel. Plataforma e-commerce moderna, design futurista e alta performance de conversão.">
  <meta name="theme-color" content="#080809">

  <meta name="robots" content="index, follow">

  <!-- Open Graph -->
  <meta property="og:title" content="Lume — Futurewear & Tech Apparel">
  <meta property="og:description" content="Peças desenvolvidas com design futurista, tecidos tecnológicos de alta respirabilidade e caimento impecável. A marca oficial que une tecnologia e moda.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:site_name" content="Lume">
  <meta property="og:image" content="/images/lume-logo.png">

  <!-- Preconnect for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://images.unsplash.com">

  <!-- JSON-LD Structured Data: ClothingStore -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ClothingStore",
    "name": "Lume",
    "description": "Futurewear & Tech Apparel. Moda tecnológica com alta conversão.",
    "priceRange": "$$",
    "currenciesAccepted": "BRL",
    "paymentAccepted": "PIX, Cartão de Crédito"
  }
  </script>

  <link rel="icon" type="image/png" href="/images/lume-icon.png">
</head>
<body>
  <app-root></app-root>
</body>
</html>
